name: Build and deploy GitHub Pages

on:
  push:
    branches: [main, preview/cut]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The site is always built from main, whichever branch triggered the run.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # ----- v2: the WebGPU Vite app -> dist/ (index.html + docs pages + vendor/) -----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build v2 app
        run: npm run build

      # ----- preview: an experiment branch built into dist/preview/<name>/ beside the main site -----
      # The main app is untouched; the preview is a second build of the same app from another branch,
      # served under its own base path. Pushing the preview branch redeploys the site too.
      - name: Checkout preview (drawn cut)
        uses: actions/checkout@v4
        with:
          ref: preview/cut
          path: preview-src/cut

      - name: Build preview (drawn cut) into dist/preview/cut
        working-directory: preview-src/cut
        run: |
          npm ci
          npx vite build --base /ColorMill/preview/cut/ --outDir ../../dist/preview/cut --emptyOutDir
          test -f ../../dist/preview/cut/index.html

      # ----- v1 legacy: C/raylib -> wasm via Emscripten -> dist/legacy/ -----
      # The Vite build above empties dist/, so the legacy build must come after it.
      # Browsers without WebGPU are pointed at legacy/index.html by the app.
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Emscripten version
        id: emver
        run: echo "version=$(emcc --version | head -n 1 | tr -cd '[:alnum:]._-')" >> "$GITHUB_OUTPUT"

      - name: Cache raylib (web)
        id: raylib-cache
        uses: actions/cache@v4
        with:
          path: raylib
          key: raylib-web-5.5-${{ steps.emver.outputs.version }}

      - name: Fetch raylib
        if: steps.raylib-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib

      - name: Build raylib for web
        if: steps.raylib-cache.outputs.cache-hit != 'true'
        run: make -C raylib/src PLATFORM=PLATFORM_WEB

      - name: Build legacy v1 app into dist/legacy
        run: make web DIST_DIR=dist/legacy

      - name: Check site layout
        run: |
          test -f dist/index.html
          test -f dist/mixer.html
          test -f dist/project.html
          test -f dist/resources.html
          test -f dist/pigment.html
          test -f dist/vendor/mixbox/mixbox.js
          test -f dist/legacy/index.html
          test -f dist/legacy/index.wasm
          test -f dist/preview/cut/index.html
          # GitHub Pages must not run Jekyll over the output (it drops _-prefixed paths).
          touch dist/.nojekyll
          find dist -maxdepth 2 -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
